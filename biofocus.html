<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioFocus</title><style>body{margin:0;font-family:system-ui;background:#f6f8f7;color:#17211b}.wrap{max-width:900px;margin:auto;padding:40px 20px}.card{background:#fff;border:1px solid #e3e9e5;border-radius:24px;padding:28px;margin-bottom:20px}h1{font-size:44px;margin:8px 0}.ey{color:#1f8f62;font-weight:800}.topics{display:flex;gap:10px;flex-wrap:wrap}.topic,.answer{padding:13px 16px;border:1px solid #e3e9e5;border-radius:14px;background:#fff;cursor:pointer}.active{background:#dff4e9;border-color:#1f8f62}.btn{padding:14px 18px;border:0;border-radius:14px;background:#1f8f62;color:white;font-weight:800;cursor:pointer}.quiz{display:none}.quiz.show{display:block}.answer{display:block;width:100%;text-align:left;margin:10px 0}.correct{background:#dff4e9!important;border-color:#1f8f62}.wrong{background:#fff1f1!important}.result{display:none;text-align:center}.result.show{display:block}.score{font-size:64px;font-weight:900;color:#1f8f62}.bar{height:8px;background:#e8eeea;border-radius:9px}.fill{height:100%;width:0;background:#1f8f62}</style></head><body><div class="wrap"><div class="card"><div class="ey">BIOLOGY PRACTICE • VIBE CODING</div><h1>BioFocus 🧬</h1><p>Мини-тренажёр по биологии с мгновенной обратной связью.</p><div class="topics"><button class="topic active" data-t="cell">🧫 Клетка</button><button class="topic" data-t="genetics">🧬 Генетика</button><button class="topic" data-t="ecology">🌿 Экология</button></div><br><button class="btn" id="start">Начать тренировку →</button></div><div class="card quiz" id="quiz"><b id="title">Клетка</b><span style="float:right" id="count"></span><p><div class="bar"><div class="fill" id="fill"></div></div></p><h2 id="q"></h2><div id="a"></div></div><div class="card result" id="result"><div class="score" id="score"></div><p id="msg"></p><button class="btn" id="again">Пройти ещё раз</button></div></div><script>const D={cell:{n:'Клетка',q:[['Какая органелла отвечает за синтез белка?',['Рибосома','Лизосома','Вакуоль','Центриоль'],0],['Где хранится основная часть ДНК эукариот?',['Цитоплазма','Ядро','Рибосомы','Мембрана'],1],['Что является энергетической станцией клетки?',['Митохондрия','Лизосома','Рибосома','Вакуоль'],0],['Какой процесс образует две дочерние клетки?',['Мейоз','Митоз','Трансляция','Оплодотворение'],1],['Что отделяет клетку от внешней среды?',['Ядро','Мембрана','Рибосома','Митохондрия'],1]]},genetics:{n:'Генетика',q:[['Что изучает генетика?',['Наследственность и изменчивость','Экосистемы','Геологию','Анатомию'],0],['Совокупность генов организма — это?',['Фенотип','Генотип','Орган','Ткань'],1],['Кто сформулировал законы наследования?',['Дарвин','Мендель','Пастер','Гук'],1],['Сколько хромосом в соматической клетке человека?',['23','44','46','48'],2],['Участок ДНК, кодирующий признак?',['Ген','Фермент','Орган','Ткань'],0]]},ecology:{n:'Экология',q:[['Кто производит органическое вещество?',['Редуценты','Консументы','Продуценты','Паразиты'],2],['Абиотический фактор — это?',['Хищничество','Температура','Конкуренция','Паразитизм'],1],['Глобальный уровень организации жизни?',['Популяция','Биосфера','Организм','Сообщество'],1],['Кто разлагает органические остатки?',['Редуценты','Продуценты','Хищники','Паразиты'],0],['Что происходит с энергией в пищевой цепи?',['Сохраняется','Уменьшается','Увеличивается','Не меняется'],1]]}};let t='cell',i=0,s=0;const $=x=>document.querySelector(x);document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{document.querySelectorAll('.topic').forEach(x=>x.classList.remove('active'));b.classList.add('active');t=b.dataset.t});$('#start').onclick=$('#again').onclick=()=>{i=0;s=0;$('#result').classList.remove('show');$('#quiz').classList.add('show');$('#title').textContent=D[t].n;render()};function render(){let x=D[t].q[i];$('#count').textContent=`${i+1} / 5`;$('#fill').style.width=`${i*20}%`;$('#q').textContent=x[0];$('#a').innerHTML=x[1].map((v,n)=>`<button class="answer" data-n="${n}">${v}</button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>ans(+b.dataset.n,x[2]))}function ans(n,c){let bs=document.querySelectorAll('.answer');bs.forEach(b=>b.disabled=true);bs[c].classList.add('correct');if(n===c)s++;else bs[n].classList.add('wrong');setTimeout(()=>{i++;i<5?render():finish()},500)}function finish(){let p=Math.round(s/5*100);$('#quiz').classList.remove('show');$('#result').classList.add('show');$('#score').textContent=p+'%';$('#msg').textContent=p>=80?'Отлично! Тема хорошо закреплена.':p>=60?'Хороший результат. Попробуйте ещё раз.':'Повторите тему и попробуйте снова.'}</script></body></html>
